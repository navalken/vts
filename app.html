<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jeju VTS</title>
<link rel="manifest" href="manifest-app.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jeju VTS">
<meta name="theme-color" content="#1a7be0">
<style>
:root{--bg:#f5f8fc;--card:#fff;--tx:#12284a;--mut:#667085;--pri:#1a7be0;--bd:#dbe4f0;--ok:#12803c;--bad:#c0392b;--chip:#e8f1fd;--warn:#fff1d6}
@media (prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#18212d;--tx:#e8edf5;--mut:#9aa7ba;--pri:#4da3ff;--bd:#2b3646;--ok:#4cc27a;--bad:#ff7b6b;--chip:#1f3350;--warn:#4a3a17}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,"Noto Sans KR",sans-serif}
header{background:#1a7be0;color:#fff;padding:14px 18px 12px;padding-top:calc(14px + env(safe-area-inset-top))}
header h1{margin:0;font-size:26px;letter-spacing:.2px}
header .sub{font-size:14px;opacity:.92;display:flex;gap:16px;flex-wrap:wrap}
main{padding:14px 16px 100px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
h2{font-size:20px;margin:6px 0 12px}
h3{font-size:16px;margin:0 0 8px}
label{display:block;font-weight:600;margin:12px 0 6px}
input,select{width:100%;padding:12px;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
input[readonly]{opacity:.7}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px 16px;background:var(--pri);color:#fff;width:100%;margin-top:10px}
button.sec{background:var(--chip);color:var(--pri)}
button.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
button:disabled{opacity:.5}
.menu button{display:flex;justify-content:space-between;align-items:center;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);font-size:18px;padding:18px 16px;margin-top:10px}
.menu button span.arr{color:var(--mut)}
.msg{margin-top:10px;padding:12px;border-radius:10px;background:var(--bg);white-space:pre-wrap;font-size:15px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mut{color:var(--mut);font-size:14px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.top button{width:auto;margin:0;padding:8px 12px;background:var(--chip);color:var(--pri)}
.team h3{display:flex;justify-content:space-between;align-items:center}
.team h3 small{color:var(--mut);font-weight:400}
.person{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;background:var(--card)}
.person .nm{flex:1;min-width:0}
.person .nm b{font-size:17px}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--pri);margin-left:4px;font-weight:600;vertical-align:middle}
.badge.leave{background:var(--warn);color:var(--tx)}
.badge.off{background:transparent;border:1px solid var(--bd);color:var(--mut)}
.ic{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--chip);color:var(--pri);text-decoration:none;font-size:20px;border:0;margin:0;padding:0}
.ic.dis{opacity:.35;pointer-events:none}
.add{background:transparent;color:var(--pri);border:1px dashed var(--pri);margin-top:0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;color:var(--mut);margin:0;border-radius:0;padding:8px 2px 6px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;width:auto}
nav button img{width:26px;height:26px;display:block}
nav button .on{display:none}nav button.on .on{display:block}nav button.on .off{display:none}
nav button.on{color:var(--pri)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.modal[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.hide{display:none}

.lv-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0}
.lv-head .mut{margin:0}
.lv-head button{width:auto;margin:0;padding:8px 12px;background:var(--chip);color:var(--pri)}
html:has(body.islive),body.islive{overflow-x:hidden;touch-action:pan-y;overscroll-behavior-x:none}
body.islive header,body.islive #tab-live>h2{display:none}
body.islive main{padding:0 0 90px;max-width:900px}
body.islive .lvpad{padding:0 16px}
/* 시안(가로 1214 기준)의 픽셀을 화면 폭에 비례해 그대로 줄여 쓴다: 1u = 시안의 1px */
.cv{--u:calc(100cqw / 1214);position:relative;width:100%;aspect-ratio:1214/1148;container-type:inline-size;background:#dbe8f7;overflow:visible;margin-bottom:2px;font-family:-apple-system,"Noto Sans KR",sans-serif}
.cv>*{position:absolute}
.cv .fl{position:absolute;overflow:hidden}
.cv .fl .flx{position:absolute;left:0;right:0;bottom:0;height:calc(var(--u)*70);background-size:100% 3500%;background-position:0 100%}
.cv .fl img{position:absolute;left:0;width:100%;display:block}
.cv .fl .flt{position:absolute;left:0;right:0;top:0;background-size:100% 8000%;background-position:0 0}
.cv .bg{left:0;width:100%;display:block;object-fit:cover}
.cv .hd{left:0;top:0;width:100%;background:linear-gradient(#e6f0fb,#d6e5f6)}
.cv .logo{object-fit:contain;object-position:left center}
.cv .gear{background:none;border:0;padding:0;margin:0;width:auto;font-size:calc(var(--u)*26);color:#12284a;opacity:.6;line-height:1}
.wx{background:rgba(255,255,255,.9);border-radius:calc(var(--u)*10);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#12284a;line-height:1.1}
.wx .c{font-weight:800;font-size:calc(var(--u)*19)}
.wx .r{display:flex;align-items:center;gap:calc(var(--u)*10);font-weight:800}
.wx .r img{width:calc(var(--u)*40);height:calc(var(--u)*40);flex:none}
.wx .r b{font-size:calc(var(--u)*24);display:block}
.wx .r small{font-size:calc(var(--u)*13);font-weight:600;display:block;color:#475467}
.clk{text-align:right;color:#0d2a63;font-weight:800;line-height:1.05;display:flex;flex-direction:column;justify-content:center}
.clk .d{font-size:calc(var(--u)*20);font-weight:700}
.clk .t{font-size:calc(var(--u)*54)}
.bdg{background:url(img/badge.png) 0 0/100% 100% no-repeat}
.bdg>*{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800}
.bdg b{left:4%;right:4%;top:7%;height:34%;color:#fff;font-size:calc(var(--u)*46);line-height:1}
.bdg span{left:3%;right:3%;top:47%;height:17%;color:#12284a;font-size:calc(var(--u)*19);white-space:nowrap}
.stag{background-size:100% 100%;background-repeat:no-repeat;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:calc(var(--u)*21);white-space:nowrap;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.stag.lead{padding-left:calc(var(--u)*40)}
.sc{background-size:100% 100%;background-repeat:no-repeat;z-index:5;cursor:pointer}
.sc>*{position:absolute}
.sc .sh{left:0;right:0;top:1%;height:22%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:calc(var(--u)*22)}
.sc .fc{border-radius:50%;object-fit:cover}
.sc.c10 .fc{left:8%;top:26%;width:29.6%;aspect-ratio:1}
.sc.c9 .fc{left:7%;top:23.6%;width:26%;aspect-ratio:1}
.sc .tx{display:flex;flex-direction:column;justify-content:center;min-width:0;line-height:1.1}
.sc.c10 .tx{left:42%;right:3%;top:26%;height:41%}
.sc.c9 .tx{left:36%;right:3%;top:24%;height:42%}
.sc .nm{font-weight:800;font-size:calc(var(--u)*21);color:#12284a;white-space:nowrap}
.sc .nm.two{font-size:calc(var(--u)*15)}
.sc .nm.none{color:#98a2b3}
.sc .ph{font-weight:800;font-size:calc(var(--u)*25);color:#0d2a63}
.sc.c9 .nm{font-size:calc(var(--u)*24)}.sc.c9 .nm.two{font-size:calc(var(--u)*17)}.sc.c9 .ph{font-size:calc(var(--u)*28)}
.sc .bt{left:0;top:0;width:100%;height:100%;pointer-events:none}
.sc .bt a,.sc .bt button{position:absolute;margin:0;padding:0;border:0;background:none;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*4);text-decoration:none;white-space:nowrap;width:auto;pointer-events:none;font-size:inherit}
.sc.c10 .bt{font-size:calc(var(--u)*13.5)}.sc.c9 .bt{font-size:calc(var(--u)*17)}
.sc.c10 .bt .call{left:6.4%;width:41.6%;top:69%;height:24.5%}.sc.c10 .bt .dir{left:50%;width:44.6%;top:69%;height:24.5%}
.sc.c9 .bt .call{left:5.2%;width:41.8%;top:67.8%;height:24.1%}.sc.c9 .bt .dir{left:48.8%;width:46.7%;top:67.8%;height:24.1%}
.sc .bt svg{width:1.1em;height:1.1em;flex:none}
.adm{position:relative;width:100%;aspect-ratio:1672/941;margin:2px 0 0;overflow:hidden}
.adm img{width:100%;display:block}
.adm .ab{position:absolute;top:82%;height:11%;width:27%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:5px;background:linear-gradient(#22b455,#0e9a3c);color:#fff;font-weight:800;border-radius:999px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);text-decoration:none;font-size:clamp(11px,3.7vw,19px)}
.adm .ab svg{width:1.1em;height:1.1em}
.sheetbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;margin-top:10px;border-radius:14px;font-size:19px;font-weight:800;text-decoration:none;color:#fff;border:0}
nav button{font-size:11px;line-height:1.15;text-align:center}
nav button.on{color:var(--pri);border-bottom:3px solid var(--pri)}
</style>
</head>
<body>
<header style="position:relative">
  <button onclick="goTab('set')" aria-label="설정" style="position:absolute;right:14px;top:calc(12px + env(safe-area-inset-top));width:auto;margin:0;padding:6px 10px;background:rgba(255,255,255,.2);font-size:20px">⚙️</button>
  <h1>〰 Jeju VTS</h1>
  <div class="sub"><span>Safe Sea, Better Tomorrow</span><span id="clock"></span></div>
</header>
<main>
  <section id="tab-my" class="hide"><h2>내 근무</h2><div class="card"><p class="mut">오늘 내 근무와 다음 장소 이동이 여기에 표시됩니다. (준비 중)</p><button class="sec" onclick="location.href='vts-simple.html'">근무표 올리고 알림 예약하기</button></div></section>
  <section id="tab-live" class="hide"><h2>실시간 근무현황</h2><div id="liveBody"><div class="card"><p class="mut">불러오는 중…</p></div></div></section>
  <section id="tab-board" class="hide"><h2>전체 근무표</h2><div id="boardBody"></div></section>
  <section id="tab-dir" class="hide"><h2>팀장지령 · 인수인계</h2><div class="card"><p class="mut">팀장 지령 목록과 인수인계가 표시됩니다. (준비 중)</p></div></section>
  <section id="tab-wx" class="hide"><h2>해상기상</h2><div class="card"><p class="mut">제주 해상 기상(파고·풍속·시정)이 표시됩니다. (준비 중)</p></div></section>
  <section id="tab-set"><div id="setBody"></div></section>
</main>
<nav>
  <button data-t="my"><img class="off" src="img/m-home-off.png" alt=""><img class="on" src="img/m-home-on.png" alt="">내 근무</button>
  <button data-t="live"><img class="off" src="img/m-team-off.png" alt=""><img class="on" src="img/m-team-on.png" alt="">실시간 근무현황</button>
  <button data-t="board"><img class="off" src="img/m-cal-off.png" alt=""><img class="on" src="img/m-cal-on.png" alt="">전체 근무표</button>
  <button data-t="dir"><img class="off" src="img/m-mega-off.png" alt=""><img class="on" src="img/m-mega-on.png" alt="">팀장지령·인수인계</button>
  <button data-t="wx"><img class="off" src="img/m-wave-off.png" alt=""><img class="on" src="img/m-wave-on.png" alt="">해상기상</button>
</nav>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>

<script>
// 관리자가 한 번만 채워 넣으세요. 비워두면 이 기기 저장값(vts_app_worker)을 씁니다.
const WORKER_URL = 'https://vts-push.navalken100.workers.dev';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = { get: k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: k => { try { localStorage.removeItem(k); } catch (e) {} } };
const base = () => (WORKER_URL || ls.get('vts_app_worker')).replace(/\/+$/, '');
const ua = navigator.userAgent;
const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const ROLE = { chief: '총괄관리자', teamadmin: '팀관리자' };
const S = { token: ls.get('vts_app_token'), code: ls.get('vts_app_code'), me: null, people: null, view: 'home', msg: '' };

// ---- 시계 ----
(function tick() { const d = new Date(); const p = n => String(n).padStart(2, '0'); $('clock').textContent = `${p(d.getMonth() + 1)}.${p(d.getDate())}  ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; setTimeout(tick, 1000); })();

// ---- 탭 ----
function goTab(t) { // 하단 메뉴 5개 + 설정(톱니바퀴)
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x.dataset.t === t));
  ['my', 'live', 'board', 'dir', 'wx', 'set'].forEach(k => $('tab-' + k).classList.toggle('hide', k !== t));
  document.body.classList.toggle('islive', t === 'live');
  if (t === 'set') renderSet();
  if (t === 'live') startLive(); else stopLive();
  if (t === 'board') startBoard();
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => goTab(b.dataset.t));

// ---- 서버 호출 ----
async function api(path, method = 'GET', body) {
  if (!base()) throw new Error('서버 주소가 설정되지 않았습니다');
  const res = await fetch(base() + path, { method, headers: { 'Content-Type': 'application/json', ...(S.token ? { 'X-Token': S.token } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(j.error || ('서버 오류 ' + res.status)); e.status = res.status; throw e; }
  return j;
}
async function loadMe() {
  if (!S.token) { S.me = null; return; }
  try { S.me = (await api('/me')).person; }
  catch (e) { if (e.status === 401) { S.me = null; S.msg = '이 기기의 등록이 만료되었습니다. 다시 등록해 주세요.'; S.token = ''; ls.del('vts_app_token'); } else throw e; }
}
async function loadPeople() { const j = await api('/people'); S.people = j.people; S.me = j.me; }
const isAdmin = () => S.me && (S.me.role === 'chief' || S.me.role === 'teamadmin');
const canEditP = p => S.me && (S.me.role === 'chief' || (S.me.role === 'teamadmin' && S.me.team === p.team));
const canAddTeam = t => S.me && (S.me.role === 'chief' || (S.me.role === 'teamadmin' && S.me.team === t));
const say = (el, t, cls) => { el.hidden = false; el.className = 'msg ' + (cls || ''); el.textContent = t; };

// ---- 푸시 등록 ----
function u8ToB64u(buf) { let s = ''; new Uint8Array(buf).forEach(c => s += String.fromCharCode(c)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function b64uToU8(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const r = atob(s); const o = new Uint8Array(r.length); for (let i = 0; i < r.length; i++) o[i] = r.charCodeAt(i); return o; }
let swReg = null;
async function vtsPendingOpen() { // 누른 알림의 카드 주소가 남아 있으면 그리로 이동
  try {
    const c = await caches.open('vts-click'), k = new URL('__click', location.href).href, r = await c.match(k);
    if (!r) return;
    const d = await r.json(); await c.delete(k);
    if (d && d.url && Date.now() - d.t < 120000 && d.url !== location.href) location.href = d.url;
  } catch (_) { /* 구형 브라우저 */ }
}
vtsPendingOpen(); document.addEventListener('visibilitychange', () => { if (!document.hidden) vtsPendingOpen(); });
try { navigator.serviceWorker.addEventListener('message', e => { const d = e.data; if (d && d.type === 'vts-open' && typeof d.url === 'string' && d.url !== location.href) location.href = d.url; }); } catch (_) { /* 구형 브라우저 */ } // 알림을 누르면 카드 화면으로 이동
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').then(r => { swReg = r; }).catch(() => {});
async function subscribeAndRegister(team, name, code) {
  if (!('PushManager' in window) || !('Notification' in window)) throw new Error(isIOS ? '이 화면에서는 알림을 쓸 수 없습니다. 홈 화면에 추가한 아이콘으로 다시 여세요.' : '이 브라우저는 푸시 알림을 지원하지 않습니다.');
  const perm = await Notification.requestPermission(); // 버튼을 누른 직접 동작 안에서 호출(iOS 필수)
  if (perm !== 'granted') throw new Error('알림이 허용되지 않았습니다. 기기 설정 → 알림에서 허용으로 바꾼 뒤 다시 시도하세요.');
  const { publicKey } = await (await fetch(base() + '/vapid-public')).json();
  const reg = swReg || await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (sub && sub.options && sub.options.applicationServerKey && u8ToB64u(sub.options.applicationServerKey) !== publicKey) { await sub.unsubscribe(); sub = null; }
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToU8(publicKey) });
  const res = await fetch(base() + '/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ team, name, code, sub: sub.toJSON() }) });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || ('등록 실패 ' + res.status));
  S.token = j.token; S.code = code; ls.set('vts_app_token', j.token); ls.set('vts_app_code', code); S.me = j.person;
}

// ---- 설정 화면 ----
async function renderSet() {
  const el = $('setBody');
  try { await loadMe(); } catch (e) { el.innerHTML = `<div class="card"><div class="msg bad">${esc(e.message)}</div></div>`; return; }
  if (!S.me) return renderOnboard();
  if (S.view === 'info') return renderInfo();
  if (S.view === 'admin') return renderAdmin();
  const roleTxt = S.me.role ? ROLE[S.me.role] : '일반';
  el.innerHTML = `<h2>설정</h2>
  <div class="card"><h3>👤 ${esc(S.me.name)} 님</h3><div class="mut">${esc(S.me.team)}팀 · ${esc(S.me.status)} · ${roleTxt}</div></div>
  <div class="menu">
    <button id="mInfo">내 정보 <span class="arr">›</span></button>
    <button id="mAdmin">관리자 관리 <span class="arr">›</span></button>
  </div>${S.msg ? `<div class="msg bad">${esc(S.msg)}</div>` : ''}`;
  $('mInfo').onclick = () => { S.view = 'info'; renderSet(); };
  $('mAdmin').onclick = () => { S.view = 'admin'; renderSet(); };
}

function renderOnboard() {
  $('setBody').innerHTML = `<h2>설정</h2>

  <div class="card">
    ${isIOS && !standalone ? `<div class="msg" style="margin:0 0 10px"><b>아이폰은 먼저 홈 화면에 추가하세요</b><br>Safari 공유 버튼(□↑) → 홈 화면에 추가 → 생긴 아이콘으로 다시 열어 등록합니다.</div>` : ''}
    <h3>처음 시작</h3>
    <label for="oTeam">팀</label>
    <select id="oTeam"><option value="">선택</option><option value="1">1팀</option><option value="2">2팀</option><option value="3">3팀</option></select>
    <label for="oCode">우리 팀 코드</label>
    <input id="oCode" autocomplete="off" autocapitalize="off" placeholder="팀 코드" value="${esc(S.code)}">
    <button id="oLoad" class="sec">명단 불러오기</button>
    <div id="oNameBox" class="hide">
      <label for="oName">내 이름</label>
      <select id="oName"></select>
      <input id="oNew" placeholder="목록에 없으면 이름 직접 입력" maxlength="20" style="margin-top:8px">
      <button id="oReg">알림 허용하고 시작</button>
    </div>
    <div class="msg" id="oMsg" hidden></div>
  </div>`;
  $('oLoad').onclick = async () => {
    const team = $('oTeam').value, code = $('oCode').value.trim();
    if (!team || !code) return say($('oMsg'), '팀과 팀 코드를 입력하세요.', 'bad');
    say($('oMsg'), '명단 불러오는 중…');
    try {
      const res = await fetch(base() + '/names?team=' + team + '&code=' + encodeURIComponent(code)); const j = await res.json();
      if (!res.ok) return say($('oMsg'), j.error || ('오류 ' + res.status), 'bad');
      $('oName').innerHTML = '<option value="">내 이름 선택(없으면 아래에 입력)</option>' + j.names.map(n => `<option value="${esc(n.name)}">${esc(n.name)}${n.registered ? ' (등록됨)' : ''}</option>`).join('');
      $('oNameBox').classList.remove('hide'); $('oMsg').hidden = true;
    } catch (e) { say($('oMsg'), '연결 실패: ' + e.message, 'bad'); }
  };
  $('oReg').onclick = async () => {
    const name = $('oNew').value.trim() || $('oName').value;
    if (!name) return say($('oMsg'), '이름을 선택하거나 입력하세요.', 'bad');
    $('oReg').disabled = true;
    try { await subscribeAndRegister($('oTeam').value, name, $('oCode').value.trim()); S.msg = ''; S.view = 'home'; renderSet(); }
    catch (e) { say($('oMsg'), e.message, 'bad'); } finally { $('oReg').disabled = false; }
  };
}

async function renderAdmin() {

    list.forEach(p => {

        ${p.phone ? `<a class="ic" href="tel:${esc(p.phone.replace(/[^0-9+]/g, ''))}" aria-label="${esc(p.name)} 전화">📞</a>` : '<span class="ic dis">📞</span>'}
        ${canEditP(p) ? `<button class="ic" data-edit="${esc(p.name)}" aria-label="수정">✎</button>` : ''}</div>`;
    });
    if (canAddTeam(t)) h += `<button class="add" data-add="${t}">＋ ${t}팀 직원 추가</button>`;
    h += '</div>';

  $('setBody').innerHTML = h; wireBack();

}

    const L = f.lead;
    h += `<div class="stag lead" data-sec="${esc(L.sec)}" data-tagonly="1" style="${P(...L.tag, bot)};background-image:url(img/t-lead.png)">팀장석</div>`;
    cardsHtml += Object.keys(f.cards).map(s => lvCard(b, s, f.cards[s], f, bot)).join('');
    below += E;
  });
  h += cardsHtml + '</div>';
  const AD = [['교육팀', '0648012770', 17.6], ['기획팀', '0648012450', 50], ['시설팀', '0648012270', 82]];
  h += `<div class="adm"><img src="${night ? 'img/adm-n.jpg' : 'img/adm.jpg'}" alt="행정실">${AD.map(a => `<a class="ab" style="left:${a[2]}%" href="tel:${a[1]}">${ICON_TEL}<span>${a[0]}</span></a>`).join('')}</div>`;
  h += `<div class="lvpad"><div class="lv-head"><p class="mut">${b ? `<b>${esc(b.team)}팀 ${SHN[b.shift]}</b> · ${hhmm(b.from)}~${hhmm(b.to)} 근무` : '지금 시각의 근무표가 없습니다'}${LV.err ? ' · ⚠ ' + esc(LV.err) : ''}</p><button id="lvRef">새로고침</button></div>`;
  if (!b && !LV.err) h += '<div class="card"><p class="mut">근무표가 예약되면 지금 근무자가 여기에 표시됩니다. (근무표는 <b>예약할 때</b> 서버에 저장되며, 근무가 끝나면 지워집니다.)</p></div>';
  if (b) {
    const known = new Set(LV_FLOORS.flatMap(f => Object.keys(f.cards)));
    const extra = Object.keys(b.sectors).filter(k => /섹터/.test(k) && !known.has(k));
    if (extra.length) h += `<div class="card"><h3>기타 섹터</h3>${extra.map(s => `<p>${esc(s)}: ${b.sectors[s].map(esc).join(', ') || '—'}</p>`).join('')}</div>`;
  }
  el.innerHTML = h + '</div>';
}
async function loadLive() {
  try { LV.data = await api('/live'); LV.err = ''; }
  catch (e) { LV.err = e.status === 401 ? '알림 등록 후 볼 수 있습니다' : e.message; }
  renderLive(); loadWx();
}
function startLive() {
  stopLive(); renderLive(); loadLive();
  LV.timer = setInterval(() => { if (!document.hidden) loadLive(); }, 60000);
  LV.clk = setInterval(() => { const c = clkParts(), t = $('lvTime'); if (t) { t.textContent = c.t; $('lvDate').textContent = c.d; } }, 1000);
}
function stopLive() { if (LV.timer) { clearInterval(LV.timer); LV.timer = null; } if (LV.clk) { clearInterval(LV.clk); LV.clk = null; } }
document.addEventListener('visibilitychange', () => { if (!document.hidden && LV.timer) loadLive(); });
let lvRz; addEventListener('resize', () => { clearTimeout(lvRz); lvRz = setTimeout(() => { if (LV.timer) renderLive(); }, 200); });
function lvDirSheet(sec) {
  const b = lvBoard(); if (!b) return;
  const all = isLead(sec), label = all ? '전체' : sec;
  openModal(`<h3>${esc(label)} 지령 입력</h3>
    <p class="mut">${esc(b.team)}팀 ${SHN[b.shift]} · ${all ? '모든 섹터로 이동하는 근무자' : esc(sec) + '으로 이동하는 근무자'}의 알림에 붙습니다. 이미 나간 알림에는 붙지 않고, 근무가 끝나면 지워집니다.</p>
    <textarea id="lvDirText" rows="4" maxlength="300" placeholder="지령 내용 (300자까지)" style="width:100%;padding:12px;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)"></textarea>
    <button id="lvDirGo">지령 올리기</button><button class="sec" onclick="closeModal()">닫기</button><div class="msg" id="lvDirMsg" hidden></div>`);
  $('lvDirGo').onclick = async () => {
    const text = $('lvDirText').value.trim(); if (!text) return say($('lvDirMsg'), '지령 내용을 입력하세요.', 'bad');
    const code = S.code || ''; if (!code) return say($('lvDirMsg'), '팀 코드가 이 기기에 없습니다. 설정에서 다시 등록하세요.', 'bad');
    try {
      const res = await fetch(base() + '/directives', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Team-Code': code }, body: JSON.stringify({ team: b.team, date: b.date, shift: b.shift, sectors: all ? [] : [sec], text }) });
      const j = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(j.error || ('서버 응답 ' + res.status));
      say($('lvDirMsg'), '지령을 올렸습니다.', 'ok'); $('lvDirGo').disabled = true;
    } catch (e) { say($('lvDirMsg'), '실패: ' + e.message, 'bad'); }
  };
}
// ---- 전체 근무표 탭: 지금 근무의 원본 근무표 사진(앱 사용자 누구나, 근무가 끝나면 서버에서 삭제). 탭하면 확대/축소 ----
async function startBoard() {
  const el = $('boardBody');
  el.innerHTML = '<div class="card"><p class="mut" id="lvPhMsg">불러오는 중…</p></div>';
  if (!LV.data) { try { LV.data = await api('/live'); } catch (e) { LV.err = e.message; } }
  const b = lvBoard();
  if (!b) { el.innerHTML = '<div class="card"><p class="mut">지금 시각의 근무표가 없습니다. 근무표가 예약되면 원본 사진을 볼 수 있습니다.</p></div>'; return; }
  el.innerHTML = `<div class="card"><p class="mut"><b>${esc(b.team)}팀 ${SHN[b.shift]}</b> · ${hhmm(b.from)}~${hhmm(b.to)} 근무표 원본</p><p class="mut" id="lvPhMsg">불러오는 중…</p>
    <div id="lvPhBox" style="overflow:auto;max-height:70vh;border:1px solid var(--bd);border-radius:10px;display:none;touch-action:pan-x pan-y pinch-zoom"><img id="lvPhImg" style="width:100%;display:block" alt="근무표 원본"></div>
    <div style="display:flex;gap:8px"><button class="sec" id="lvZm">－ 축소</button><button class="sec" id="lvZp">＋ 확대</button></div></div>`;
  let z = 100; const apply = () => { $('lvPhImg').style.width = z + '%'; };
  $('lvZp').onclick = () => { z = Math.min(500, z + 50); apply(); };
  $('lvZm').onclick = () => { z = Math.max(100, z - 50); apply(); };
  $('lvPhImg').onclick = () => { z = z > 100 ? 100 : 250; apply(); };
  try {
    const j = await api('/photo?team=' + b.team + '&date=' + b.date + '&shift=' + b.shift);
    $('lvPhImg').src = 'data:image/jpeg;base64,' + j.img; $('lvPhBox').style.display = 'block'; $('lvPhMsg').textContent = '사진을 탭하면 확대·축소됩니다 (버튼도 가능)';
  } catch (e) { $('lvPhMsg').textContent = e.status === 404 ? '저장된 원본 사진이 없습니다. (이 기능을 넣기 전에 예약했거나 이미 근무가 끝났습니다)' : '실패: ' + e.message; }
}
// 카드를 누르면 큰 버튼창(통화·지령입력)이 올라옴(카드 안 버튼은 폰에서 너무 작아 손가락으로 누르기 어려움)
function lvActionSheet(sec, tagOnly) {
  const b = lvBoard(), names = lvNames(b, sec), tel = LV_TEL[sec], lead = isLead(sec);
  const who = lead ? '팀장' : (names.join(', ') || '근무자 없음');
  openModal(`<h3>${esc(lead ? '팀장석' : sec)} · ${esc(who)}</h3>
    <p class="mut">내선 ${tel}</p>
    <a class="sheetbtn" style="background:#16a34a" href="tel:${LV_PREFIX}${tel}">📞 통화 ${LV_PREFIX}${tel}</a>
    ${tagOnly || (lead && sec === '팀장석10') ? '' : '<button class="sheetbtn" style="background:#2f8fff" id="lvToDir">📝 지령 입력</button>'}
    <button class="sec" onclick="closeModal()">닫기</button>`);
  const g = $('lvToDir'); if (g) g.onclick = () => lvDirSheet(sec);
}
document.addEventListener('click', e => {
  const c = e.target.closest('[data-sec]');
  if (c) lvActionSheet(c.dataset.sec, c.dataset.tagonly === '1'); else if (e.target.id === 'lvRef') loadLive();
});
function openModal(html) { $('sheet').innerHTML = html; $('modal').hidden = false; }
function closeModal() { $('modal').hidden = true; }
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });

function openAdd(team) {
  openModal(`<h3>${team}팀 직원 추가</h3>
    <label>이름</label><input id="aName" maxlength="20">
    <label>전화번호 (선택)</label><input id="aPhone" type="tel" inputmode="tel" placeholder="010-0000-0000">
    <button id="aSave">추가</button><button class="sec" id="aCancel">닫기</button><div class="msg" id="aMsg" hidden></div>`);
  $('aCancel').onclick = closeModal;
  $('aSave').onclick = async () => {
    try { await api('/admin/person', 'POST', { action: 'add', name: $('aName').value.trim(), team, phone: $('aPhone').value.trim() }); closeModal(); renderAdmin(); }
    catch (e) { say($('aMsg'), e.message, 'bad'); }
  };
}

function openEdit(p) {
  const chief = S.me.role === 'chief';
  openModal(`<h3>${esc(p.name)} 수정</h3>
    <label>이름</label><input id="eName" value="${esc(p.name)}" maxlength="20">
    <label>팀</label><select id="eTeam">${['1', '2', '3'].map(t => `<option value="${t}" ${p.team === t ? 'selected' : ''}>${t}팀</option>`).join('')}</select>
    <label>상태</label><select id="eStatus"><option ${p.status === '재직' ? 'selected' : ''}>재직</option><option ${p.status === '휴직' ? 'selected' : ''}>휴직</option></select>
    <label>전화번호</label><input id="ePhone" type="tel" inputmode="tel" value="${esc(p.phone)}">
    <button id="eSave">저장</button>
    ${chief && p.role !== 'chief' ? `<button class="sec" id="eRole">${p.role === 'teamadmin' ? '팀관리자 해제' : '이 팀의 팀관리자로 지정'}</button>` : ''}
    ${chief && p.role !== 'chief' ? `<button class="sec" id="eXfer">총괄관리자를 이 사람에게 인계</button>` : ''}
    ${p.role !== 'chief' ? '<button class="danger" id="eDel">명단에서 삭제</button>' : ''}
    <button class="sec" id="eCancel">닫기</button><div class="msg" id="eMsg" hidden></div>`);
  const done = () => { closeModal(); renderAdmin(); };
  const run = async fn => { try { await fn(); done(); } catch (e) { say($('eMsg'), e.message, 'bad'); } };
  $('eCancel').onclick = closeModal;
  $('eSave').onclick = () => run(() => api('/admin/person', 'POST', { action: 'update', name: p.name, newName: $('eName').value.trim(), team: $('eTeam').value, status: $('eStatus').value, phone: $('ePhone').value.trim() }));
  if ($('eRole')) $('eRole').onclick = () => run(() => api('/admin/role', 'POST', { name: p.name, role: p.role === 'teamadmin' ? '' : 'teamadmin' }));
  if ($('eXfer')) $('eXfer').onclick = () => { if (confirm(`총괄관리자를 ${p.name}님에게 인계합니다. 나는 일반 권한이 됩니다. 계속할까요?`)) run(async () => { await api('/admin/transfer', 'POST', { name: p.name }); }); };
  if ($('eDel')) $('eDel').onclick = () => { if (confirm(`${p.name}님을 명단에서 삭제할까요?`)) run(() => api('/admin/person', 'POST', { action: 'delete', name: p.name })); };
}

renderSet();
</script>
