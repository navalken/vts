<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jeju VTS</title>
<link rel="manifest" href="manifest-app.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jeju VTS">
<meta name="theme-color" content="#1a7be0">
<style>
:root{--bg:#f5f8fc;--card:#fff;--tx:#12284a;--mut:#667085;--pri:#1a7be0;--bd:#dbe4f0;--ok:#12803c;--bad:#c0392b;--chip:#e8f1fd;--warn:#fff1d6}
@media (prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#18212d;--tx:#e8edf5;--mut:#9aa7ba;--pri:#4da3ff;--bd:#2b3646;--ok:#4cc27a;--bad:#ff7b6b;--chip:#1f3350;--warn:#4a3a17}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,"Noto Sans KR",sans-serif}
header.mhbar{padding:0;background:none;max-width:560px;margin:0 auto}
header{background:#1a7be0;color:#fff;padding:14px 18px 12px;padding-top:calc(14px + env(safe-area-inset-top))}
header h1{margin:0;font-size:26px;letter-spacing:.2px}
header .sub{font-size:14px;opacity:.92;display:flex;gap:16px;flex-wrap:wrap}
main{padding:14px 16px 100px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
h2{font-size:20px;margin:6px 0 12px}
h3{font-size:16px;margin:0 0 8px}
label{display:block;font-weight:600;margin:12px 0 6px}
input,select{width:100%;padding:12px;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
input[readonly]{opacity:.7}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px 16px;background:var(--pri);color:#fff;width:100%;margin-top:10px}
button.sec{background:var(--chip);color:var(--pri)}
button.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
button:disabled{opacity:.5}
.menu button{display:flex;justify-content:space-between;align-items:center;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);font-size:18px;padding:18px 16px;margin-top:10px}
.menu button span.arr{color:var(--mut)}
.msg{margin-top:10px;padding:12px;border-radius:10px;background:var(--bg);white-space:pre-wrap;font-size:15px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mut{color:var(--mut);font-size:14px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.top button{width:auto;margin:0;padding:8px 12px;background:var(--chip);color:var(--pri)}
.team h3{display:flex;justify-content:space-between;align-items:center}
.team h3 small{color:var(--mut);font-weight:400}
.person{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;background:var(--card)}
.person .nm{flex:1;min-width:0}
.person .nm b{font-size:17px}
.tg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:start}.tg h3{font-size:16px;text-align:center;margin:6px 0 8px}.tg h3 small{display:block;font-size:12px}
.pc{position:relative;border-radius:10px;padding:10px 8px 9px;background:var(--card);border:1px solid var(--bd);margin-bottom:8px;min-height:62px}.pc.can{cursor:pointer}.pc.lead{background:#ffefd2;border-color:#f3d79b}.pc.sub{background:#e4f0ff;border-color:#bcd7f7}.pc.leave{opacity:.6}
.pc b{display:block;font-size:15px;line-height:1.25;word-break:keep-all}.pc small{display:block;color:var(--mut);font-size:11px;margin-top:2px;line-height:1.3}.pc .tel{position:absolute;right:5px;top:5px;font-size:13px;text-decoration:none}
.tg .add{width:100%;padding:9px 0;margin:0;font-size:13px}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--pri);margin-left:4px;font-weight:600;vertical-align:middle}
.badge.leave{background:var(--warn);color:var(--tx)}
.badge.off{background:transparent;border:1px solid var(--bd);color:var(--mut)}
.ic{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--chip);color:var(--pri);text-decoration:none;font-size:20px;border:0;margin:0;padding:0}
.ic.dis{opacity:.35;pointer-events:none}
.add{background:transparent;color:var(--pri);border:1px dashed var(--pri);margin-top:0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;color:var(--mut);margin:0;border-radius:0;padding:8px 2px 6px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;width:auto}
nav button img{width:26px;height:26px;display:block}
nav button .on{display:none}nav button.on .on{display:block}nav button.on .off{display:none}
nav button.on{color:var(--pri)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.modal[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.hide{display:none}
/* ===== 라이브러리 ===== */
#tab-lib{padding:0}
.lib{font-family:-apple-system,"Noto Sans KR",sans-serif;color:#12284a}
.lib h2{font-size:19px;margin:6px 0 10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lib .bk{width:auto;margin:0 4px 0 0;font-size:13px;font-weight:800;color:#1a6be0;background:#e8f1fd;border:0;border-radius:99px;padding:4px 11px}
.lib .lc{background:#fff;border:1px solid #dbe4f0;border-radius:14px;box-shadow:0 1px 6px rgba(20,60,120,.08)}
.lib .banner{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#e8f1fd,#f6faff);border:1.5px solid #cfe1fa;border-radius:16px;padding:10px 14px;margin-bottom:12px}
.lib .banner img{height:70px;width:auto}.lib .banner b{font-size:15px;display:block}.lib .banner span{font-size:12.5px;color:#667085;font-weight:600;line-height:1.4}
.lib .big{display:flex;align-items:center;gap:12px;padding:16px;margin-bottom:10px;font-weight:800;font-size:17px;width:100%;text-align:left;color:#12284a;cursor:pointer}
.lib .big .ic{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:28px;flex:none}
.lib .big small{display:block;font-size:12.5px;color:#667085;font-weight:600;margin-top:2px}.lib .big .ar{margin-left:auto;color:#98a1b0;font-size:22px}
.lib .fd{display:flex;align-items:center;gap:10px;padding:10px 11px;margin-bottom:8px;font-weight:700;font-size:14.5px}
.lib .fd .go{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:none;border:0;padding:0;margin:0;width:auto;text-align:left;color:#12284a;font:inherit;cursor:pointer}
.lib .fd .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:22px;background:#fff4d6;flex:none}
.lib .fd .tx{min-width:0}.lib .fd .tx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib small{display:block;font-size:11.5px;color:#667085;font-weight:600;margin-top:1px}
.lib .n{font-size:12px;font-weight:800;color:#1a6be0;background:#e8f1fd;border-radius:99px;padding:3px 9px;flex:none}.lib .n.z{background:#eef0f3;color:#98a1b0}
.lib .sm{width:auto;margin:0;background:none;border:0;padding:4px 5px;font-size:13px;font-weight:800;color:#98a1b0;flex:none}.lib .sm.d{color:#c0392b}
.lib .btn{display:flex;align-items:center;justify-content:center;gap:6px;background:#1a6be0;color:#fff;border-radius:13px;padding:13px;font-weight:800;font-size:15px;margin-top:6px;width:100%;border:0}.lib .btn.o{background:#fff;color:#1a6be0;border:1.5px solid #1a6be0}
.lib .fl{display:flex;align-items:center;gap:10px;padding:10px 11px;margin-bottom:8px}
.lib .fl .ti{width:38px;height:44px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:900;color:#fff;flex:none}
.lib .fl .tx{min-width:0;flex:1}.lib .fl b{font-size:14px;display:block;line-height:1.3;word-break:break-all}
.lib .fl .dl{font-size:20px;color:#1a6be0;text-decoration:none;flex:none;padding:2px 4px}
.lib .new{font-size:10px;background:#e8453c;color:#fff;border-radius:99px;padding:1px 6px;margin-left:5px;vertical-align:1px}
.lib .lk{display:flex;align-items:center;gap:10px;padding:10px 11px;margin-bottom:8px;font-weight:800;font-size:15px}
.lib .lk a.go{display:flex;align-items:center;gap:12px;flex:1;min-width:0;color:#12284a;text-decoration:none}
.lib .lk .ic{width:38px;height:38px;border-radius:11px;background:#e8f1fd;display:grid;place-items:center;font-size:21px;flex:none}
.lib .lk .ar{margin-left:auto;color:#1a6be0;font-weight:900}
.lib .mutc{color:#667085;font-size:12px;font-weight:600;text-align:center;margin-top:10px}
.lib .empty{text-align:center;color:#667085;padding:22px 10px;font-size:14px;font-weight:600}
.lsheet h3{margin:0 0 12px;font-size:17px}
.lsheet .inp{display:block;width:100%;border:1.5px solid #dbe4f0;border-radius:11px;padding:11px 12px;margin:0 0 9px;font-size:15px;box-sizing:border-box;background:#fff;color:#12284a}
.lsheet label.l{display:block;font-size:11.5px;color:#667085;font-weight:700;margin:0 0 3px}
.lsheet .emo{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}.lsheet .emo button{width:auto;margin:0;padding:6px 9px;font-size:20px;background:#f2f6fc;border:1.5px solid transparent;border-radius:10px}.lsheet .emo button.on{border-color:#1a6be0}
.lsheet .msg{min-height:18px;font-size:13px;font-weight:700;color:#c0392b;margin:2px 0 6px}
.lsheet .btn{display:flex;align-items:center;justify-content:center;background:#1a6be0;color:#fff;border-radius:13px;padding:13px;font-weight:800;font-size:15px;width:100%;border:0;margin-top:6px}.lsheet .btn.o{background:#fff;color:#1a6be0;border:1.5px solid #1a6be0}
.lsheet .btn[disabled]{opacity:.55}
/* ===== 내 근무 ===== */
body.ismy header,body.ismy #tab-my>h2{display:none}
body.ismy main{padding:0 0 96px;max-width:560px}
.my{font-family:-apple-system,"Noto Sans KR",sans-serif;color:#12284a}
.mh{position:relative;width:100%;aspect-ratio:815/250;container-type:inline-size;--u:calc(100cqw/815);background:#8cc8ff center/cover no-repeat;overflow:hidden}
.mh>*{position:absolute}
.mh .logo{left:calc(var(--u)*12);top:calc(var(--u)*10);width:calc(var(--u)*196);height:calc(var(--u)*72);object-fit:contain;object-position:left center;background:rgba(255,255,255,.86);border-radius:calc(var(--u)*14);padding:calc(var(--u)*5) calc(var(--u)*10);box-sizing:border-box}
.mh .mclk{right:calc(var(--u)*44);top:calc(var(--u)*12);text-align:right;font-weight:800;line-height:1.05;color:#0d2a63;text-shadow:0 0 calc(var(--u)*6) rgba(255,255,255,.9)}
.mh.n .mclk{color:#fff;text-shadow:0 1px calc(var(--u)*6) rgba(0,0,20,.7)}
.mh .mclk .d{font-size:calc(var(--u)*20);font-weight:700}
.mh .mclk .t{font-size:calc(var(--u)*40);letter-spacing:.5px;font-variant-numeric:tabular-nums}
.mh .gear{right:calc(var(--u)*6);top:calc(var(--u)*6);background:none;border:0;padding:0;margin:0;width:auto;font-size:calc(var(--u)*26);opacity:.65;line-height:1}
.mh .cap{left:calc(var(--u)*10);bottom:0;height:calc(var(--u)*150);width:auto}
.mh .who{left:calc(var(--u)*130);bottom:calc(var(--u)*14);background:rgba(255,255,255,.88);border-radius:calc(var(--u)*14);padding:calc(var(--u)*6) calc(var(--u)*12);max-width:calc(var(--u)*190);line-height:1.15}
.mh .who b{display:block;font-size:calc(var(--u)*26);color:#12284a}
.mh .who span{display:block;font-size:calc(var(--u)*13);color:#475467;font-weight:600}
.mh .mwx{right:calc(var(--u)*8);bottom:calc(var(--u)*8);display:flex;gap:calc(var(--u)*6)}
.mh .mwx .wx{position:static;width:calc(var(--u)*96);height:calc(var(--u)*82);border-radius:calc(var(--u)*10)}
.mh .mwx .wx .c{font-size:calc(var(--u)*17)}
.mh .mwx .wx .r{gap:calc(var(--u)*4)}
.mh .mwx .wx .r img{width:calc(var(--u)*32);height:calc(var(--u)*32)}
.mh .mwx .wx .r b{font-size:calc(var(--u)*20)}
.mh .mwx .wx .r small{font-size:calc(var(--u)*11)}
.mg{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:8px 9px 0}
.mg .card{margin:0;padding:10px 9px;border-radius:14px;box-shadow:0 1px 6px rgba(20,60,120,.1)}
.tl{padding:12px 10px 12px!important}.st{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tlh{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.tlh b{font-size:18px;color:#12284a}
.chip2{font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;background:#e8f1fd;color:#1a5fb4}
.trow{margin-top:4px}
.trow .rt{font-size:11px;font-weight:800;color:#667085;height:16px}
.cps{position:relative;height:60px}
.cps.thin{height:2px}
.cps img{position:absolute;bottom:-2px;height:58px;width:auto;transform:translateX(-50%);filter:drop-shadow(0 1px 1px rgba(0,0,0,.18));pointer-events:none}
.cells{display:flex;gap:4px;container-type:inline-size;--k:8}
.cell{--c:#2f7be8;--w:calc((100cqw - 4px*(var(--k) - 1))/var(--k));flex:0 0 var(--w);min-width:0;height:calc(var(--w)*1.7);min-height:62px;border-radius:11px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:calc(var(--w)*.27);line-height:1.1;position:relative;overflow:hidden;white-space:nowrap}
.cell.rest{--c:#f59e0b}.cell.wait{--c:#22a45d}
.cell img{width:calc(var(--w)*.62);height:calc(var(--w)*.62);margin-bottom:2px;object-fit:contain}
.cell .nm{font-size:calc(var(--w)*.55);line-height:1;font-weight:900}
.cell.nx{background:color-mix(in srgb,var(--c) 22%,#fff)}
.cell.cur{background:var(--c);color:#fff;box-shadow:0 0 0 3px #ffee00,0 0 0 4.5px rgba(20,30,50,.35),0 0 6px 5px rgba(255,238,0,.85);animation:myPulse 1.3s ease-in-out infinite;z-index:1}
.cell.done{background:#eceff3;border-color:#d4d9e1;color:#98a1b0}
.cell.done>*{opacity:.45}
.cell.done::after{content:'';position:absolute;inset:0;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M5 5L19 19M19 5L5 19' stroke='%237b8494' stroke-width='2.4' stroke-linecap='round'/></svg>") center/78% auto no-repeat;opacity:.8}
.cell.flag{--c:#1f3a73;background:#fff}
.cell.flag img{width:calc(var(--w)*.7);height:calc(var(--w)*.7)}
@keyframes myPulse{0%,100%{box-shadow:0 0 0 3px #ffee00,0 0 0 4.5px rgba(20,30,50,.35),0 0 6px 5px rgba(255,238,0,.85)}50%{box-shadow:0 0 0 3px #ffee00,0 0 0 4.5px rgba(20,30,50,.35),0 0 2px 1px rgba(255,238,0,.2)}}
@media (prefers-reduced-motion:reduce){.cell.cur{animation:none}}
.lbs{display:flex;gap:4px;margin-top:4px;margin-bottom:8px}
.lbs i{flex:0 0 calc((100% - 4px*(var(--k) - 1))/var(--k));min-width:0;overflow:hidden;white-space:nowrap;text-align:center;font-style:normal;font-size:11px;color:#667085;font-weight:700;font-variant-numeric:tabular-nums}
.lgd{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:12px;color:#667085;font-weight:600}
.lgd span{display:inline-flex;align-items:center;gap:4px}
.lgd i{width:11px;height:11px;border-radius:3px;display:inline-block}
.hero{--c:#2f7be8;grid-column:1/-1;border-radius:14px;padding:9px 12px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 14%,#fff),color-mix(in srgb,var(--c) 5%,#fff));border:1.5px solid color-mix(in srgb,var(--c) 40%,#fff);box-shadow:0 1px 6px rgba(20,60,120,.1)}
.hero.rest{--c:#f59e0b}.hero.wait{--c:#22a45d}
.hero .hh{display:flex;align-items:center;gap:7px;font-weight:800;font-size:14px;color:var(--c)}
.hero .hh img{width:30px;height:30px;object-fit:contain}
.hero .hrow{display:flex;align-items:baseline;gap:12px;margin-top:4px;flex-wrap:wrap}
.hero .hp{font-size:28px;font-weight:900;line-height:1;color:#12284a}
.hero .ht{font-size:16px;font-weight:700;color:#344054;font-variant-numeric:tabular-nums}
.hero .hb{height:7px;border-radius:99px;background:color-mix(in srgb,var(--c) 18%,#fff);margin-top:6px;overflow:hidden}
.hero .hb i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .6s linear}
.hero .hl{margin-top:4px;font-size:14px;font-weight:800;color:var(--c)}
.hero .hn{margin-top:3px;font-size:12px;color:#667085;font-weight:600}
.mini{--c:#2f7be8;border-radius:14px;padding:7px 9px;background:#fff;border:1.5px solid color-mix(in srgb,var(--c) 30%,#fff);box-shadow:0 1px 6px rgba(20,60,120,.08);min-width:0}
.mini.rest{--c:#f59e0b}.mini.wait{--c:#22a45d}.mini.none{--c:#98a1b0;background:#f7f8fa}
.mini .mh2{display:flex;align-items:center;gap:5px;font-weight:800;font-size:12px;color:var(--c)}
.mini .mh2 img{width:24px;height:24px;flex:none;object-fit:contain}
.mini .mp{white-space:nowrap;font-size:19px;font-weight:900;margin-top:4px;line-height:1.05}
.mini .mt{font-size:12.5px;font-weight:700;color:#344054;margin-top:2px;font-variant-numeric:tabular-nums}
.mini .mi{font-size:12px;font-weight:800;color:var(--c);margin-top:3px}
.mini .mf{font-size:11px;color:#667085;font-weight:600;margin-top:2px}
.mini .mq{font-size:12.5px;color:#667085;font-weight:700;margin-top:6px;line-height:1.35}
.cd{display:flex;flex-direction:row;align-items:center;gap:10px;text-align:left;background:linear-gradient(#f3f8ff,#fff);padding:6px 12px!important}
.cd .cdh{display:flex;flex-direction:column;align-items:flex-start;font-weight:800;font-size:12px;color:#1a5fb4;line-height:1.2;flex:none}
.cd .cdh img{width:24px;height:24px;margin-bottom:1px}
.cd .cdt{font-size:28px;font-weight:900;color:#1a6be0;font-variant-numeric:tabular-nums;letter-spacing:-.5px;line-height:1;flex:none}
.cd .cds{font-size:11px;color:#475467;font-weight:700;line-height:1.3;min-width:0}
.cd .cdi{height:52px;width:auto;margin-left:auto;flex:none}
.nag{margin:9px 9px 0;border-radius:14px;padding:11px 13px;background:#fff1f1;border:1.5px solid #ffd0d0;box-shadow:0 1px 6px rgba(180,40,40,.08)}
.nag .nh{display:flex;align-items:center;gap:7px;font-weight:900;font-size:15px;color:#c0392b}
.nag .nh img{width:30px;height:30px}
.nag .ni{display:flex;gap:8px;align-items:flex-start;margin-top:8px;font-size:14.5px;line-height:1.4;font-weight:600;color:#12284a}
.nag .ni b{flex:none;font-size:11.5px;padding:2px 8px;border-radius:99px;background:#c0392b;color:#fff;margin-top:1px}
.nag .ni b.s{background:#1a6be0}
.nag .ni span{white-space:pre-wrap;word-break:break-word;min-width:0}
.mstate{margin:12px 9px 0;text-align:center;padding:18px 14px 16px}
.mstate img{height:150px;width:auto;max-width:80%}
.mstate h3{margin:8px 0 4px;font-size:19px}
.mstate p{margin:0;color:#667085;font-size:14px;line-height:1.5}
.mstate button{margin-top:12px;width:auto;padding:10px 18px}

.mbt{display:flex;gap:8px;margin:9px 9px 0}
.mbt .mb1,.mbt .mb2{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:13px;padding:13px 8px;font-size:15px;font-weight:800;text-decoration:none;border:1.5px solid #1a6be0;margin:0;width:auto;line-height:1.2}

.sc.c10 .bt .call{left:6.4%;width:41.6%;top:69%;height:24.5%}.sc.c10 .bt .dir{left:50%;width:44.6%;top:69%;height:24.5%}

.wxn{font-size:9.5px;font-weight:800;color:#2a4a86}.wxn em{font-style:normal;font-weight:600;color:#6b7a95;font-size:9px}
.wxr{display:flex;align-items:center;justify-content:center;gap:2px}.wxr b{font-size:15px;line-height:1.1}.wxk small,.wxchip small{font-size:9px;color:#6b7a95}.wxw{font-size:10px;font-weight:700}
.wxar{width:15px;height:15px;fill:#2f7be8;flex:none}
.wxk.l1,.wxchip.l1{border-color:#f59e0b}.wxk.l1 .wxar,.wxchip.l1 .wxar{fill:#f59e0b}.wxk.l2,.wxchip.l2{border-color:#e03b3b;background:#fff0f0f0}.wxk.l2 .wxar,.wxchip.l2 .wxar{fill:#e03b3b}.wxk.l3,.wxchip.l3{border-color:#7a1020;background:#ffe3e6}.wxk.l3 .wxar,.wxchip.l3 .wxar{fill:#7a1020}
.wxsub{font-size:11px;color:var(--mut);margin:8px 2px 0;font-weight:700}
.wxlg{display:flex;gap:10px;flex-wrap:wrap;font-size:10.5px;color:#51607c;padding:8px 4px 0}.wxlg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.wxhd,.wxrow{display:grid;grid-template-columns:1.5fr 1fr .9fr .8fr;align-items:center;gap:6px}.wxhd{padding:2px 6px 6px;font-size:11px;color:var(--mut);font-weight:700}
.wxrow{padding:8px 6px;border-bottom:1px solid #e3e9f3}.wxrow:last-of-type{border:0}.wxrow .rn b{font-size:15px;display:block}.wxrow small{color:var(--mut);font-size:10.5px}.wxrow .rw{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700}
.wxrow .wxar{width:24px;height:24px}.wxrow .rs b,.wxrow .rh b{font-size:22px}.wxrow.l2 .rs b,.wxrow.l2 .rh b,.wxrow.l3 .rs b,.wxrow.l3 .rh b{color:#d12d2d}.wxrow.l1 .rs b{color:#c77a00}.wxrow.l2,.wxrow.l3{background:#fff1f1;border-radius:8px}

<body>
<header id="hdr" class="mhbar"></header>
<main>
  <section id="tab-my" class="hide"><div id="myBody"></div></section>
  <section id="tab-live" class="hide"><h2>실시간 근무현황</h2><div id="liveBody"><div class="card"><p class="mut">불러오는 중…</p></div></div></section>
  <section id="tab-board" class="hide"><h2><button class="bkb" onclick="navBack()">‹ 내 근무</button>전체 근무표</h2><div id="boardBody"></div></section>
  <section id="tab-lib" class="hide"><div id="libBody"></div></section>
  <section id="tab-wx" class="hide"><div id="wxBody"></div></section>

</main>
<nav>
  <button data-t="my"><img class="off" src="img/m-home-off.png" alt=""><img class="on" src="img/m-home-on.png" alt="">내 근무</button>
  <button data-t="live"><img class="off" src="img/m-team-off.png" alt=""><img class="on" src="img/m-team-on.png" alt="">실시간 근무현황</button>
  <button data-t="lib"><img class="off" src="img/m-lib-off.png" alt=""><img class="on" src="img/m-lib-on.png" alt="">라이브러리</button>
  <button data-t="wx"><img class="off" src="img/m-wave-off.png" alt=""><img class="on" src="img/m-wave-on.png" alt="">해상기상</button>
  <button data-t="set"><img class="off" src="img/m-set-off.png" alt=""><img class="on" src="img/m-set-on.png" alt="">설정</button>
</nav>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>

<script>
// 관리자가 한 번만 채워 넣으세요. 비워두면 이 기기 저장값(vts_app_worker)을 씁니다.
const WORKER_URL = 'https://vts-push.navalken100.workers.dev';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = { get: k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: k => { try { localStorage.removeItem(k); } catch (e) {} } };
const base = () => (WORKER_URL || ls.get('vts_app_worker')).replace(/\/+$/, '');
const ua = navigator.userAgent;
const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const ROLE = { chief: '총괄관리자', teamadmin: '팀관리자' };
const S = { token: ls.get('vts_app_token'), code: ls.get('vts_app_code'), me: null, people: null, view: 'home', msg: '' };

// ---- 시계 ----
(function tick() { try { const t = $('hdTime'); if (t) { const c = myKstClock(myNowMs()); t.textContent = c.t; $('hdDate').textContent = c.d; } } catch (_) { /* 무시 */ } setTimeout(tick, 1000); })();
function paintHdr() { if (CURT === 'my' || CURT === 'live') return; try { $('hdr').innerHTML = myHead(myNowMs(), 'hd'); } catch (_) { /* 무시 */ } }


// ---- 해상기상 탭 ----
const WXLINK_1 = 'https://www.weather.go.kr/w/special-report/overall.do', WXLINK_3 = 'https://marine.kma.go.kr/mmis/m', WXLINK_4 = 'https://www.windy.com/33.400/126.550?33.400,126.550,8';
const WX = { d: null, err: '', model: null, mt: 0, busy: false, timer: null, at: 0 };
// 지도 위 카드 자리(%): 점(관측 위치)에서 선으로 이어 겹치지 않게 놓음
const WX_POS = { KG_0028: [66, 24], DT_0021: [50, 7], DT_0004: [33, 41], DT_0022: [87, 45], DT_0023: [15, 89], TW_0075: [39, 91], DT_0010: [63, 88], M1: [19, 20], M2: [11, 50], M3: [88, 66] };
const WX_OFF = ['KG_0021', 'IE_0060'], WX_OFFTXT = { KG_0021: '▼ 구역 남쪽 바깥 약90km', IE_0060: '◀ 구역 남서쪽 바깥' };
const WX_MODEL = [['M1', '북서 해상', 33.80, 126.31], ['M2', '서쪽 해상', 33.42, 126.11], ['M3', '남동 해상', 33.28, 126.98]];
const WX_DIRS = ['북', '북북동', '북동', '동북동', '동', '동남동', '남동', '남남동', '남', '남남서', '남서', '서남서', '서', '서북서', '북서', '북북서'];
const wxDir = d => d == null ? '—' : WX_DIRS[Math.floor((d + 11.25) / 22.5) % 16] + '풍';
const wxLvl = (ws, wh) => { wh = wh || 0; return ws >= 21 || wh >= 5 ? 'l3' : ws >= 14 || wh >= 3 ? 'l2' : ws >= 10 || wh >= 2 ? 'l1' : ''; };
const wxArrow = wd => wd == null ? '' : `<svg class="wxar" style="transform:rotate(${(wd + 180) % 360}deg)" viewBox="0 0 24 24"><path d="M12 2 L19 20 L12 16 L5 20 Z"/></svg>`;
const wxXY = (lat, lon) => { const x = 680 + (lon - 126.25) * 1032.857, y = 130 + (33.95 - lat) * 1239.286; return [(x - 230) / 1500 * 100, (y - 40) / 1300 * 100]; };
const wxT = t => { const m = /(\d{2}):(\d{2})/.exec(t || ''); return m ? m[1] + ':' + m[2] : '--:--'; };
function wxCard(p, cls, pos, extra) {
  const w = p.wh != null ? `<div class="wxw">파고 <b>${p.wh.toFixed(1)}</b>m</div>` : '';
  const ws = p.ws == null ? '-' : p.ws.toFixed(1);
  return `<div class="${cls} ${p.k} ${wxLvl(p.ws, p.wh)}" ${pos ? `style="left:${pos[0]}%;top:${pos[1]}%"` : ''}><div class="wxn">${esc(p.nm)}${extra ? ` <em>${extra}</em>` : ''}</div><div class="wxr">${wxArrow(p.ws === 0 ? null : p.wd)}<b>${ws}</b><small>m/s</small></div>${w}</div>`;
}
function wxPoints() { // 관측(부이 b·관측소 t) + 모델(m) 합치기
  const out = [];
  ((WX.d && WX.d.pts) || []).forEach(x => out.push({ c: x.c, nm: x.nm, lat: x.lat, lon: x.lon, wd: x.wd, ws: x.ws, wh: x.wh, t: wxT(x.t), k: x.src === 'b' ? 'b' : 't' }));
  (WX.model || []).forEach(x => out.push(x));
  return out;
}
function renderWx() {
  const el = $('wxBody'); if (!el) return;
  const pts = wxPoints(), on = [], off = [];
  pts.forEach(p => { if (WX_OFF.includes(p.c)) off.push(p); else if (WX_POS[p.c] && p.lat != null) on.push(p); });
  let lines = '', mk = '';
  on.forEach(p => { const [x, y] = wxXY(p.lat, p.lon), c = WX_POS[p.c]; lines += `<line x1="${x.toFixed(2)}" y1="${y.toFixed(2)}" x2="${c[0]}" y2="${c[1]}" stroke="#16233b" stroke-width=".5" vector-effect="non-scaling-stroke"/>`; mk += `<i class="wxdot" style="left:${x.toFixed(2)}%;top:${y.toFixed(2)}%"></i>` + wxCard(p, 'wxk', c, p.k === 'm' ? '모델' : ''); });
  const mapHtml = `<svg class="ln" viewBox="0 0 100 100" preserveAspectRatio="none">${lines}</svg>${mk}`;
  const chips = off.map(p => wxCard(p, 'wxchip', null, WX_OFFTXT[p.c] || '')).join('');
  const rows = pts.filter(p => p.ws != null).sort((a, b) => b.ws - a.ws).map(p => `<div class="wxrow ${wxLvl(p.ws, p.wh)}"><div class="rn"><b>${esc(p.nm)}</b><small>${p.t} · ${p.k === 'b' ? '부이' : p.k === 't' ? '관측소' : '예측모델'}${WX_OFF.includes(p.c) ? ' · 구역 밖' : ''}</small></div><div class="rw">${wxArrow(p.ws === 0 ? null : p.wd)}<span>${p.ws === 0 ? '무풍' : wxDir(p.wd)}</span></div><div class="rs"><b>${p.ws.toFixed(1)}</b><small>m/s</small></div><div class="rh">${p.wh != null ? `<b>${p.wh.toFixed(1)}</b><small>m</small>` : '<small>-</small>'}</div></div>`).join('');
  const d = WX.at ? new Date(WX.at) : null, hm = d ? String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') : '';
  const err = WX.err ? `<div class="card"><p class="mut" style="color:var(--bad)">${esc(WX.err)}</p></div>` : '';
  el.innerHTML = `<div class="wxlinks"><a href="${WXLINK_1}" data-ext="1">① 기상특보<small>날씨누리 ↗</small></a><span>② 관제구역<small>풍향·풍속·파고</small></span><a href="${WXLINK_3}" data-ext="1">③ 해상특보<small>해양기상포털 ↗</small></a><a href="${WXLINK_4}" data-ext="1">④ 윈디<small>바람지도 ↗</small></a></div>${err}
  <div class="card"><div class="wxh"><b>제주 관제구역 실황</b><span style="font-size:11px;color:var(--mut)">${hm ? hm + ' 확인 ' : ''}<button id="wxRef">${WX.busy ? '…' : '↻'}</button></span></div>
  <div class="wxmap" id="wxMap">${mapHtml}</div>${chips ? `<div class="wxsub">관제구역 밖 (참고)</div>${chips}` : ''}
  <div class="wxlg"><span><i style="background:#2f7be8"></i>보통</span><span><i style="background:#f59e0b"></i>주의 풍속10↑·파고2↑</span><span><i style="background:#e03b3b"></i>위험 풍속14↑·파고3↑</span></div>
  <div class="wxlg"><span>실선=부이(파고 포함)</span><span>점선=관측소(풍향·풍속만)</span><span>작은 점선=예측모델(관측 아님)</span></div><div class="wxnote">지도를 누르면 크게 볼 수 있습니다.</div></div>

function u8ToB64u(buf) { let s = ''; new Uint8Array(buf).forEach(c => s += String.fromCharCode(c)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }

  try {

    if (!r) return;
    const d = await r.json(); await c.delete(k);
    if (d && d.url && Date.now() - d.t < 120000 && d.url !== location.href) location.href = d.url;
  } catch (_) { /* 구형 브라우저 */ }

async function subscribeAndRegister(team, name, code) {
  if (!('PushManager' in window) || !('Notification' in window)) throw new Error(isIOS ? '이 화면에서는 알림을 쓸 수 없습니다. 홈 화면에 추가한 아이콘으로 다시 여세요.' : '이 브라우저는 푸시 알림을 지원하지 않습니다.');
  const perm = await Notification.requestPermission(); // 버튼을 누른 직접 동작 안에서 호출(iOS 필수)
  if (perm !== 'granted') throw new Error('알림이 허용되지 않았습니다. 기기 설정 → 알림에서 허용으로 바꾼 뒤 다시 시도하세요.');
  const { publicKey } = await (await fetch(base() + '/vapid-public')).json();

  if (sub && sub.options && sub.options.applicationServerKey && u8ToB64u(sub.options.applicationServerKey) !== publicKey) { await sub.unsubscribe(); sub = null; }
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToU8(publicKey) });
  const res = await fetch(base() + '/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ team, name, code, sub: sub.toJSON() }) });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || ('등록 실패 ' + res.status));
  S.token = j.token; S.code = code; ls.set('vts_app_token', j.token); ls.set('vts_app_code', code); S.me = j.person; ls.set('vts_app_team', S.me.team);
}

function libLinkSheet(l) {
  let emo = l ? l.emoji : '🔗';
  libSheet(`<h3>${l ? '✎ 링크 고치기' : '🔗 링크 추가'}</h3><label class="l">이름</label><input class="inp" id="lsName" maxlength="30" placeholder="예: 선박안전기술공단" value="${esc(l ? l.name : '')}"><label class="l">주소</label><input class="inp" id="lsUrl" inputmode="url" autocapitalize="off" placeholder="https://" value="${esc(l ? l.url : '')}"><label class="l">그림</label><div class="emo">${LIB_EMOJI.map(e => `<button type="button" data-e="${e}" class="${e === emo ? 'on' : ''}">${e}</button>`).join('')}</div><div class="msg" id="lsMsg"></div><button class="btn" id="lsOk">${l ? '저장' : '추가'}</button><button class="btn o" onclick="closeModal()">취소</button>`);
  document.querySelectorAll('.lsheet .emo button').forEach(b => b.onclick = () => { emo = b.dataset.e; document.querySelectorAll('.lsheet .emo button').forEach(x => x.classList.toggle('on', x === b)); });
  $('lsOk').onclick = () => { $('lsOk').disabled = true; libDo(() => libCall(l ? '/lib/link/update' : '/lib/link', 'POST', { id: l && l.id, name: $('lsName').value, url: $('lsUrl').value.trim(), emoji: emo })); };
}
function libUploadSheet(folderId) {
  const d = LIBS.d, f = d.folders.find(x => x.id === folderId);
  libSheet(`<h3>⬆ 자료 올리기</h3><label class="l">폴더</label><div class="inp" style="background:#f6f9fd">${esc(f ? f.name : '')}</div><label class="l">파일 (${Math.round(d.limits.file / 1048576)}MB 이하)</label><input class="inp" id="lsFile" type="file"><label class="l">이름 (비워 두면 파일 이름)</label><input class="inp" id="lsName" maxlength="80" placeholder="예: 야간 근무 수칙.pdf"><div class="msg" id="lsMsg"></div><button class="btn" id="lsOk">올리기</button><button class="btn o" onclick="closeModal()">취소</button>`);
  $('lsFile').onchange = () => { const x = $('lsFile').files[0]; if (x && !$('lsName').value) $('lsName').value = x.name; };
  $('lsOk').onclick = () => {
    const x = $('lsFile').files[0]; if (!x) return libMsg('파일을 선택하세요.');
    if (x.size > d.limits.file) return libMsg('파일이 너무 큽니다(' + Math.round(d.limits.file / 1048576) + 'MB 이하).');
    let name = $('lsName').value.trim() || x.name; if (!/\.[A-Za-z0-9]{1,6}$/.test(name) && /\.[A-Za-z0-9]{1,6}$/.test(x.name)) name += '.' + x.name.split('.').pop();
    $('lsOk').disabled = true; $('lsOk').textContent = '올리는 중…';
    libDo(() => libCall('/lib/upload?folder=' + encodeURIComponent(folderId) + '&name=' + encodeURIComponent(name) + '&type=' + encodeURIComponent(x.type || ''), 'POST', null, x));
  };
}
document.addEventListener('click', e => {
  const b = e.target.closest('#libBody [data-a]'); if (!b) return;
  const a = b.dataset.a, id = b.dataset.id, d = LIBS.d; if (!d) return;
  if (a === 'go') return libGo(b.dataset.v, id);
  if (a === 'fadd') return libFolderSheet(null);
  if (a === 'frn') return libFolderSheet(d.folders.find(x => x.id === id));
  if (a === 'fdel') { const f = d.folders.find(x => x.id === id); if (confirm(`"${f.name}" 폴더를 지울까요?` + (f.count ? `\n\n안에 든 자료 ${f.count}개도 함께 사라집니다.` : ''))) libCall('/lib/folder/delete', 'POST', { id }).then(r => { LIBS.d = r; renderLib(); }).catch(er => alert(er.message)); return; }
  if (a === 'xadd') return libUploadSheet(LIBS.folder);
  if (a === 'xdel') { const x = d.files.find(v => v.id === id); if (confirm(`"${x.name}" 자료를 지울까요?`)) libCall('/lib/file/delete', 'POST', { id }).then(r => { LIBS.d = r; renderLib(); }).catch(er => alert(er.message)); return; }
  if (a === 'ladd') return libLinkSheet(null);
  if (a === 'ledit') return libLinkSheet(d.links.find(x => x.id === id));
  if (a === 'ldel') { const l = d.links.find(x => x.id === id); if (confirm(`"${l.name}" 링크를 지울까요?`)) libCall('/lib/link/delete', 'POST', { id }).then(r => { LIBS.d = r; renderLib(); }).catch(er => alert(er.message)); return; }
});

function lvDirSheet(sec) {
  const b = lvBoard(); if (!b) return;
  const all = isLead(sec), label = all ? '전체' : sec;
  openModal(`<h3>${esc(label)} 지령 입력</h3>
    <p class="mut">${esc(b.team)}팀 ${SHN[b.shift]} · ${all ? '모든 섹터로 이동하는 근무자' : esc(sec) + '으로 이동하는 근무자'}의 알림에 붙습니다. 이미 나간 알림에는 붙지 않고, 근무가 끝나면 지워집니다.</p>
    <textarea id="lvDirText" rows="4" maxlength="300" placeholder="지령 내용 (300자까지)" style="width:100%;padding:12px;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)"></textarea>
    <button id="lvDirGo">지령 올리기</button><button class="sec" onclick="closeModal()">닫기</button><div class="msg" id="lvDirMsg" hidden></div>`);
  $('lvDirGo').onclick = async () => {
    const text = $('lvDirText').value.trim(); if (!text) return say($('lvDirMsg'), '지령 내용을 입력하세요.', 'bad');
    const code = S.code || ''; if (!code) return say($('lvDirMsg'), '팀 코드가 이 기기에 없습니다. 설정에서 다시 등록하세요.', 'bad');
    try {
      const res = await fetch(base() + '/directives', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Team-Code': code }, body: JSON.stringify({ team: b.team, date: b.date, shift: b.shift, sectors: all ? [] : [sec], text }) });
      const j = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(j.error || ('서버 응답 ' + res.status));
      say($('lvDirMsg'), '지령을 올렸습니다.', 'ok'); $('lvDirGo').disabled = true;
    } catch (e) { say($('lvDirMsg'), '실패: ' + e.message, 'bad'); }
  };
}
// ---- 전체 근무표 탭: 지금 근무의 원본 근무표 사진(앱 사용자 누구나, 근무가 끝나면 서버에서 삭제). 탭하면 확대/축소 ----
async function startBoard() {
  const el = $('boardBody');
  el.innerHTML = '<div class="card"><p class="mut" id="lvPhMsg">불러오는 중…</p></div>';
  if (!LV.data) { try { LV.data = await api('/live'); } catch (e) { LV.err = e.message; } }
  const b = lvBoard();
  if (!b) { el.innerHTML = '<div class="card"><p class="mut">지금 시각의 근무표가 없습니다. 근무표가 예약되면 원본 사진을 볼 수 있습니다.</p></div>'; return; }
  el.innerHTML = `<div class="card"><p class="mut"><b>${esc(b.team)}팀 ${SHN[b.shift]}</b> · ${hhmm(b.from)}~${hhmm(b.to)} 근무표 원본</p><p class="mut" id="lvPhMsg">불러오는 중…</p>
    <div id="lvPhBox" style="overflow:auto;max-height:70vh;border:1px solid var(--bd);border-radius:10px;display:none;touch-action:pan-x pan-y pinch-zoom"><img id="lvPhImg" style="width:100%;display:block" alt="근무표 원본"></div>
    <div style="display:flex;gap:8px"><button class="sec" id="lvZm">－ 축소</button><button class="sec" id="lvZp">＋ 확대</button></div></div>`;
  let z = 100; const apply = () => { $('lvPhImg').style.width = z + '%'; };
  $('lvZp').onclick = () => { z = Math.min(500, z + 50); apply(); };
  $('lvZm').onclick = () => { z = Math.max(100, z - 50); apply(); };
  $('lvPhImg').onclick = () => { z = z > 100 ? 100 : 250; apply(); };
  try {
    const j = await api('/photo?team=' + b.team + '&date=' + b.date + '&shift=' + b.shift);
    $('lvPhImg').src = 'data:image/jpeg;base64,' + j.img; $('lvPhBox').style.display = 'block'; $('lvPhMsg').textContent = '사진을 탭하면 확대·축소됩니다 (버튼도 가능)';
  } catch (e) { $('lvPhMsg').textContent = e.status === 404 ? '저장된 원본 사진이 없습니다. (이 기능을 넣기 전에 예약했거나 이미 근무가 끝났습니다)' : '실패: ' + e.message; }
}
// 카드를 누르면 큰 버튼창(통화·지령입력)이 올라옴(카드 안 버튼은 폰에서 너무 작아 손가락으로 누르기 어려움)
function lvActionSheet(sec, tagOnly) {
  const b = lvBoard(), names = lvNames(b, sec), tel = LV_TEL[sec], lead = isLead(sec);
  const who = lead ? '팀장' : (names.join(', ') || '근무자 없음');
  openModal(`<h3>${esc(lead ? '팀장석' : sec)} · ${esc(who)}</h3>
    <p class="mut">내선 ${tel}</p>
    <a class="sheetbtn" style="background:#16a34a" href="tel:${LV_PREFIX}${tel}">📞 통화 ${LV_PREFIX}${tel}</a>
    ${tagOnly || (lead && sec === '팀장석10') ? '' : '<button class="sheetbtn" style="background:#2f8fff" id="lvToDir">📝 지령 입력</button>'}
    <button class="sec" onclick="closeModal()">닫기</button>`);
  const g = $('lvToDir'); if (g) g.onclick = () => lvDirSheet(sec);
}
document.addEventListener('click', e => { // 외부 링크는 같은 창에서 열고, 뒤로 돌아오면 보던 화면으로
  const a = e.target.closest('a[data-ext]');
  if (a) { try { sessionStorage.setItem('vts_ret', JSON.stringify({ t: CURT, l: [LIBS.view, LIBS.folder || null], at: Date.now() })); } catch (_) { /* 무시 */ } }
});
document.addEventListener('click', e => {
  const c = e.target.closest('[data-sec]');
  if (c) lvActionSheet(c.dataset.sec, c.dataset.tagonly === '1'); else if (e.target.id === 'lvRef') loadLive();
});
function openModal(html) { $('sheet').innerHTML = html; $('modal').hidden = false; }
function closeModal() { $('modal').hidden = true; }
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });

function openAdd(team) {
  openModal(`<h3>${team}팀 직원 추가</h3>
    <label>이름</label><input id="aName" maxlength="20">
    <label>전화번호 (선택)</label><input id="aPhone" type="tel" inputmode="tel" placeholder="010-0000-0000">
    <button id="aSave">추가</button><button class="sec" id="aCancel">닫기</button><div class="msg" id="aMsg" hidden></div>`);
  $('aCancel').onclick = closeModal;
  $('aSave').onclick = async () => {
    try { await api('/admin/person', 'POST', { action: 'add', name: $('aName').value.trim(), team, phone: $('aPhone').value.trim() }); closeModal(); renderAdmin(); }
    catch (e) { say($('aMsg'), e.message, 'bad'); }
  };
}

function openEdit(p) {
  const chief = S.me.role === 'chief';
  openModal(`<h3>${esc(p.name)} 수정</h3>
    <label>이름</label><input id="eName" value="${esc(p.name)}" maxlength="20">
    <label>팀</label><select id="eTeam">${['1', '2', '3'].map(t => `<option value="${t}" ${p.team === t ? 'selected' : ''}>${t}팀</option>`).join('')}</select>
    <label>상태</label><select id="eStatus"><option ${p.status === '재직' ? 'selected' : ''}>재직</option><option ${p.status === '휴직' ? 'selected' : ''}>휴직</option></select>
    <label>보직 (팀장 최대 2명, 부팀장 최대 3명)</label><select id="ePos">${[['', '팀원'], ['팀장', '팀장'], ['부팀장', '부팀장']].map(o => `<option value="${o[0]}" ${(p.pos || '') === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>
    <label>전화번호</label><input id="ePhone" type="tel" inputmode="tel" value="${esc(p.phone)}">
    <button id="eSave">저장</button>
    ${chief && p.role !== 'chief' ? `<button class="sec" id="eRole">${p.role === 'teamadmin' ? '팀관리자 해제' : '이 팀의 팀관리자로 지정'}</button>` : ''}
    ${chief && p.role !== 'chief' ? `<button class="sec" id="eXfer">총괄관리자를 이 사람에게 인계</button>` : ''}
    ${p.role !== 'chief' ? '<button class="danger" id="eDel">명단에서 삭제</button>' : ''}
    <button class="sec" id="eCancel">닫기</button><div class="msg" id="eMsg" hidden></div>`);
  const done = () => { closeModal(); renderAdmin(); };
  const run = async fn => { try { await fn(); done(); } catch (e) { say($('eMsg'), e.message, 'bad'); } };
  $('eCancel').onclick = closeModal;
  $('eSave').onclick = () => run(() => api('/admin/person', 'POST', { action: 'update', name: p.name, newName: $('eName').value.trim(), team: $('eTeam').value, status: $('eStatus').value, pos: $('ePos').value, phone: $('ePhone').value.trim() }));
  if ($('eRole')) $('eRole').onclick = () => run(() => api('/admin/role', 'POST', { name: p.name, role: p.role === 'teamadmin' ? '' : 'teamadmin' }));
  if ($('eXfer')) $('eXfer').onclick = () => { if (confirm(`총괄관리자를 ${p.name}님에게 인계합니다. 나는 일반 권한이 됩니다. 계속할까요?`)) run(async () => { await api('/admin/transfer', 'POST', { name: p.name }); }); };
  if ($('eDel')) $('eDel').onclick = () => { if (confirm(`${p.name}님을 명단에서 삭제할까요?`)) run(() => api('/admin/person', 'POST', { action: 'delete', name: p.name })); };
}

(function startNav() {
  let ret = null;
  try { ret = JSON.parse(sessionStorage.getItem('vts_ret') || 'null'); sessionStorage.removeItem('vts_ret'); } catch (_) { /* 무시 */ }
  let fresh = true; try { const n = performance.getEntriesByType('navigation')[0]; fresh = !n || n.type === 'navigate'; } catch (_) { /* 무시 */ }
  try {
    if (fresh) { history.replaceState({ g: 1 }, ''); history.pushState({ t: 'my', d: 0 }, ''); }
    else if (!(history.state && history.state.t)) history.replaceState({ t: 'my', d: 0 }, '');
  } catch (_) { /* 무시 */ }
  show('my');
  if (ret && ret.t && ret.t !== 'my' && Date.now() - (ret.at || 0) < 3600000) { // 외부 링크에서 돌아옴 → 보던 화면 복원
    if (ret.t === 'lib' && ret.l) { LIBS.view = ret.l[0]; LIBS.folder = ret.l[1]; }
    try { if (!(history.state && history.state.t === ret.t)) history.pushState({ t: ret.t, d: 1 }, ''); } catch (_) { /* 무시 */ }
    show(ret.t);
  }
})();
</script>
</body>
