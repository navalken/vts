<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VTS 사용설명서</title><style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#16233b;--mut:#5b6b85;--pri:#1a73e8;--bd:#dbe3ef;--warn:#fff4e5;--warnb:#f0b35a}
@media(prefers-color-scheme:dark){:root{--bg:#0e1626;--card:#16233b;--tx:#eaf1ff;--mut:#9fb0cc;--pri:#6aa8ff;--bd:#2a3a58;--warn:#3a2d17;--warnb:#a87a2c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.55;font-size:17px}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:23px;margin:6px 0 4px}p.sub{color:var(--mut);margin:0 0 14px;font-size:15px}
.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1;padding:14px 8px;font-size:18px;font-weight:800;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px}
.tabs button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:12px 0}
.step{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:14px 0}
.step h3{margin:0 0 6px;font-size:19px;display:flex;gap:10px;align-items:flex-start}.step h3 i{flex:0 0 auto;background:#e63030;color:#fff;font-style:normal;width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:17px;margin-top:1px}
.step p{margin:4px 0 10px;color:var(--mut);font-size:16px}.step img{width:100%;max-width:340px;display:block;margin:6px auto 0;border-radius:12px;border:1px solid var(--bd)}
.warn{background:var(--warn);border:1px solid var(--warnb);border-radius:14px;padding:12px 14px;margin:12px 0;font-size:16px}
.url{background:var(--bg);border:1px dashed var(--pri);border-radius:12px;padding:12px;font-weight:800;word-break:break-all;text-align:center;font-size:16px}
details{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;margin:8px 0}summary{font-weight:800;cursor:pointer}
details p{color:var(--mut);margin:8px 0 2px;font-size:16px}
.pane{display:none}.pane.on{display:block}b.k{color:var(--pri)}
.nocap{color:var(--mut);font-size:14px;text-align:center;margin:2px 0 6px}

.tip{background:var(--card);border-left:5px solid var(--pri);border-radius:10px;padding:10px 14px;margin:12px 0;font-size:16px}
a.big{display:block;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0;color:var(--tx);text-decoration:none;font-size:19px;font-weight:800}
a.big small{display:block;color:var(--mut);font-weight:400;font-size:15px;margin-top:4px}</style></head><body><div class="wrap">
